server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev

  # ==================== 数据源 ====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:family_doctor}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # ==================== JPA ====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # ==================== Spring AI - OpenAI ====================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.3
          max-tokens: 2048
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== JWT ====================
jwt:
  secret: ${JWT_SECRET:YW55LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3ItZmFtaWx5LWRvY3Rvci1hcHA=}
  expiration: 604800000  # 7 days in ms
  refresh-expiration: 2592000000  # 30 days in ms

# ==================== PGVector DataSource ====================
pgvector:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:vectorstore}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}

# ==================== 支付配置 ====================
payment:
  wechat:
    app-id: ${WX_APP_ID:}
    merchant-id: ${WX_MERCHANT_ID:}
    private-key-path: ${WX_PRIVATE_KEY_PATH:}
    serial-number: ${WX_SERIAL_NUMBER:}
    api-v3-key: ${WX_API_V3_KEY:}
    notify-url: ${WX_NOTIFY_URL:http://localhost:8080/api/v1/payments/wx/callback}
  alipay:
    app-id: ${ALI_APP_ID:}
    private-key: ${ALI_PRIVATE_KEY:}
    public-key: ${ALI_PUBLIC_KEY:}
    notify-url: ${ALI_NOTIFY_URL:http://localhost:8080/api/v1/payments/ali/callback}
    return-url: ${ALI_RETURN_URL:http://localhost:3000/success}

# ==================== 日志 ====================
logging:
  level:
    com.familydoctor: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: WARN
